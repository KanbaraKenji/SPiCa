# Windows packages for Spica: a per-user installer (no administrator rights)
# and a portable exe. See docs/design/desktop-shell.md, "打包与更新".
#   npm run dist -w @spica/desktop
appId: dev.spica.desktop
# appId and productName are Spica's; a company's deploy.json replaces them at
# packaging time (scripts/dist.mjs), with the shortcut name, file names and icon.
productName: Spica
copyright: Copyright The Spica Authors
directories:
  output: release
  buildResources: resources/branding
# Everything the app runs is bundled into out/ by electron-vite, so no
# node_modules ship. Brand assets are needed at runtime for the window icon.
files:
  - out/**
  - resources/branding/png/**
  - package.json
  - "!**/*.map"
# A company's own update / announcement source goes here when it packages the
# app (copy deploy.example.json to deploy.json); nothing is shipped otherwise.
extraResources:
  - from: deploy.json
    to: deploy.json
    filter: ["**/*"]
asar: true
# Electron fuses, flipped in the packaged exe: an installed Spica does not open a
# debugger on --inspect / --inspect-brk, nor read NODE_OPTIONS (either would let
# whoever starts it run code in the main process). Run-as-node stays on: plugin
# servers written in Node run on this exe (ELECTRON_RUN_AS_NODE).
electronFuses:
  runAsNode: true
  enableNodeCliInspectArguments: false
  enableNodeOptionsEnvironmentVariable: false
npmRebuild: false
win:
  icon: resources/branding/spica.ico
  target:
    - target: nsis
      arch: x64
    - target: portable
      arch: x64
  # Ask for no elevation; per-user install only.
  requestedExecutionLevel: asInvoker
nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Spica
  # The last page's box 开机时启动 (ticked on a first install), shortcuts made again once over an older copy
  # (rc.3's last page could delete them), and removing the sign-in entry on uninstall. See the file.
  include: resources/installer/finish-options.nsh
  artifactName: Spica-Setup-${version}.${ext}
  deleteAppDataOnUninstall: false
portable:
  artifactName: Spica-Portable-${version}.${ext}
# latest.yml (version, file name, sha512) is written next to the installer; the
# app's updater reads it from the update source. The URL here is a placeholder
# and is not used by the app. The channel is fixed: without it a pre-release
# version such as 0.1.0-rc.1 is written as rc.yml, which neither the updater
# nor the release workflow looks for.
publish:
  provider: generic
  url: https://updates.example.invalid/spica
  channel: latest
