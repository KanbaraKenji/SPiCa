name: Release

# Two ways in:
#   - Push a tag like v0.2.0: build the Windows packages and the official plugin
#     zips (with SHA-256 files and index.json) and publish them as a GitHub Release. Prepare the tag locally with: npm run release:prepare -- 0.2.0
#   - Push a branch named ci/release-dryrun*: the same build, but the packages
#     are only uploaded as workflow artifacts. No Release, no tag.
on:
  push:
    tags:
      - 'v*'
    branches:
      - 'ci/release-dryrun*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      # No code-signing certificate: build unsigned.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # On a tag, the tag is the version: if package.json disagrees (tag pushed
      # without release:prepare), the packages still carry the tag's version.
      # On a dry-run branch, the version in apps/desktop/package.json is used.
      - name: Decide the version
        shell: bash
        run: |
          current="$(node -p "require('./apps/desktop/package.json').version")"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
            if [ "$current" != "$version" ]; then
              echo "::warning::apps/desktop/package.json says $current, tag says $version; building $version."
              node -e "const f='apps/desktop/package.json';const fs=require('fs');const p=JSON.parse(fs.readFileSync(f,'utf8'));p.version='$version';fs.writeFileSync(f,JSON.stringify(p,null,2)+'\n')"
            fi
          else
            version="$current"
            echo "Dry run on $GITHUB_REF_NAME: building $version, nothing will be published."
          fi
          echo "SPICA_VERSION=$version" >> "$GITHUB_ENV"

      - run: npm run lint
      - run: npm run typecheck
      # Retried once for the same reason as in ci.yml.
      - name: Test (retry once)
        shell: bash
        run: |
          npm test || { echo "::warning::Tests failed on the first run; retrying once."; npm test; }
      - run: npm run scan:sensitive

      # Per-user NSIS installer (no administrator rights) + portable exe,
      # see apps/desktop/electron-builder.yml.
      - run: npm run dist

      # Official plugins: <name>-<version>.zip and .zip.sha256 for each folder in
      # plugins/, plus index.json, into out/plugins/ (scripts/release/pack-plugins.mjs).
      # On the Release, the index.json URL works as an HTTP plugin source.
      - run: npm run pack:plugins

      - name: Check the packages
        shell: bash
        run: |
          cd apps/desktop/release
          ls -la
          for f in "Spica-Setup-$SPICA_VERSION.exe" "Spica-Setup-$SPICA_VERSION.exe.blockmap" "Spica-Portable-$SPICA_VERSION.exe" latest.yml; do
            [ -f "$f" ] || { echo "::error::missing $f"; exit 1; }
          done
          cd "$GITHUB_WORKSPACE/out/plugins"
          ls -la
          [ -f index.json ] || { echo "::error::missing out/plugins/index.json"; exit 1; }
          sha256sum -c *.zip.sha256

      - name: Upload the packages (dry run)
        if: github.ref_type == 'branch'
        uses: actions/upload-artifact@v4
        with:
          name: spica-${{ env.SPICA_VERSION }}-dryrun
          path: |
            apps/desktop/release/Spica-Setup-${{ env.SPICA_VERSION }}.exe
            apps/desktop/release/Spica-Setup-${{ env.SPICA_VERSION }}.exe.blockmap
            apps/desktop/release/Spica-Portable-${{ env.SPICA_VERSION }}.exe
            apps/desktop/release/latest.yml
            out/plugins/*.zip
            out/plugins/*.zip.sha256
            out/plugins/index.json
          if-no-files-found: error
          retention-days: 7

      - name: Publish the GitHub Release
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prerelease=""
          case "$SPICA_VERSION" in *-*) prerelease="--prerelease" ;; esac
          notes="$RUNNER_TEMP/release-notes.md"
          {
            echo "## Install"
            echo
            echo "- \`Spica-Setup-$SPICA_VERSION.exe\`: installs for the current user, no administrator rights needed."
            echo "- \`Spica-Portable-$SPICA_VERSION.exe\`: runs without installing."
            echo
            echo "## Official plugins"
            echo
            echo "In Spica, open Settings › Plugins › Market (设置 › 插件 › 市场; or Plugin market in the left sidebar), press Add source (添加来源) and paste this address:"
            echo
            echo "    https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/index.json"
            echo
            echo "Spica lists the plugins below the sources and checks each one's SHA-256 before installing. You can also download a \`.zip\` and add its path the same way."
            echo
          } > "$notes"
          gh release create "$GITHUB_REF_NAME" \
            "apps/desktop/release/Spica-Setup-$SPICA_VERSION.exe" \
            "apps/desktop/release/Spica-Setup-$SPICA_VERSION.exe.blockmap" \
            "apps/desktop/release/Spica-Portable-$SPICA_VERSION.exe" \
            apps/desktop/release/latest.yml \
            out/plugins/*.zip \
            out/plugins/*.zip.sha256 \
            out/plugins/index.json \
            --repo "$GITHUB_REPOSITORY" \
            --title "Spica $GITHUB_REF_NAME" \
            --notes-file "$notes" \
            --generate-notes $prerelease
