<!doctype html>
<html lang="zh-CN" class="fit">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>设置</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="settings">
  <form id="form" class="fields">
    <label class="field" for="folder">笔记文件夹</label>
    <div class="field-row">
      <input id="folder" type="text" spellcheck="false" autocomplete="off">
      <button type="button" id="pick">选择…</button>
    </div>
    <label class="field" for="catalog">目录服务地址</label>
    <input id="catalog" type="text" spellcheck="false" autocomplete="off" placeholder="https://catalog.example.test/search">
    <div class="actions">
      <button type="submit" class="primary" id="save" disabled>保存</button>
      <span id="status" class="muted" role="status"></span>
    </div>
  </form>
  <script src="settings.js"></script>
</body>
</html>
